[build]
builder = "dockerfile"

[[services]]
name = "api"
source = "."
[services.build]
dockerfilePath = "services/api/Dockerfile"
[services.deploy]
startCommand = "sh -c 'alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 300'"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[services]]
name = "worker"
source = "."
[services.build]
dockerfilePath = "services/worker/Dockerfile"
[services.deploy]
startCommand = "python -m clipper_worker.worker"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[services]]
name = "web"
source = "apps/web"
[services.build]
builder = "nixpacks"
[services.deploy]
startCommand = "npm run start"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
