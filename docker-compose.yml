services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clipper}
      POSTGRES_USER: ${POSTGRES_USER:-clipper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clipper-dev-password}
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r0
    environment:
      MINIO_BROWSER: "on"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-clipper}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-clipper-dev-password}
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      CLIPPER_PROJECT_NAME: ${CLIPPER_PROJECT_NAME:-Local AI Video Clipper API}
      CLIPPER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-clipper}:${POSTGRES_PASSWORD:-clipper-dev-password}@postgres:5432/${POSTGRES_DB:-clipper}
      CLIPPER_REDIS_URL: redis://redis:6379/0
      CLIPPER_OBJECT_STORAGE_ENDPOINT_URL: http://minio:9000
      CLIPPER_OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-clipper}
      CLIPPER_OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-clipper-dev-password}
      CLIPPER_OBJECT_STORAGE_BUCKET: ${CLIPPER_OBJECT_STORAGE_BUCKET:-videos}
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      CLIPPER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-clipper}:${POSTGRES_PASSWORD:-clipper-dev-password}@postgres:5432/${POSTGRES_DB:-clipper}
      CLIPPER_REDIS_URL: redis://redis:6379/0
      CLIPPER_OBJECT_STORAGE_ENDPOINT_URL: http://minio:9000
      CLIPPER_OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-clipper}
      CLIPPER_OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-clipper-dev-password}
      CLIPPER_OBJECT_STORAGE_BUCKET: ${CLIPPER_OBJECT_STORAGE_BUCKET:-videos}
      CLIPPER_WHISPER_MODEL: ${CLIPPER_WHISPER_MODEL:-small}
      CLIPPER_HF_TOKEN: ${CLIPPER_HF_TOKEN:-}
      HF_HOME: /models
      PYANNOTE_CACHE: /models/pyannote
      REDIS_URL: redis://redis:6379/0
    volumes:
      - whisper_models:/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  whisper_models:
